# Fixture Plane config for the fusion-plane dry-run test suite.
# Values are deterministic placeholders; --plan performs no network.
base_url: "https://plane.example.test"
workspace_slug: "demo-ws"
project_id: "00000000-0000-0000-0000-000000000000"
states:
  "Backlog": "Backlog"
  "Todo": "Todo"
  "In Progress": "In Progress"
  "Done": "Done"
  "Cancelled": "Cancelled"
state_fallback:
  "Cancelled": ["Done"]
# Deliberately RENAMED label names (a localised board): the tests assert these
# values, which proves the kind label is read from config rather than hardcoded.
labels:
  "circle": "Zirkel"
  "fusion-issue": "Fusion Issue"
  "decision": "Entscheidung"
